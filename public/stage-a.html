<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chopstory · Demo Stage — 方案A 食旅横卷</title>
<style>
  /* =====================================================================
     方案 A 「食旅横卷」· 迭代3
     香槟淡白底 + 固定云纹；手机内 app 恒为 392px 调试尺寸（整体缩放适配）；
     左栏与时间轴按视口宽度流式缩放。
     ===================================================================== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper: #fbf8f1; --paper-2: #f6f1e6;
    --ink: #262019; --ink-2: #4c4437; --ink-3: #75695a; --ink-4: #b9ad97;
    --zhu: #b23a2f; --zhu-deep: #7e241c; --tea: #f0e9da;
    --dot: clamp(28px, 2.2vw, 38px);
  }
  html, body { height: 100%; }
  body {
    color: var(--ink); overflow: hidden;
    font-family: "Songti SC", "STSong", Georgia, serif;
    background-color: var(--paper);
    /* 云纹 · 固定基底（不随站点变化） */
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='160'><g fill='none' stroke='rgba(38,32,25,0.055)' stroke-width='1.4'><path d='M40 110 a26 26 0 1 1 52 0 a16 16 0 1 0 -32 0 a8 8 0 1 1 16 0'/><path d='M92 110 q44 16 92 0'/><path d='M170 48 a18 18 0 1 1 36 0 a11 11 0 1 0 -22 0 a5 5 0 1 1 10 0'/><path d='M206 48 q26 10 54 0'/></g></svg>");
    background-size: 260px 160px;
  }
  /* 纸纹颗粒 */
  .grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 60; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.04'/></svg>");
  }
  /* 文武边（印刷版框） */
  .stage {
    position: fixed; inset: 18px; z-index: 2;
    border: 3px solid var(--ink);
    /* 1fr 空列在两侧吸收多余宽度：文字列+手机作为一组居中，间距恒定 */
    display: grid; grid-template-columns: 1fr clamp(340px, 29vw, 580px) max-content 1fr; grid-template-rows: 1fr auto;
    padding: 2vh 3vw 0;
  }
  .stage::before { content: ""; position: absolute; inset: 6px; border: 1px solid var(--ink); pointer-events: none; }

  /* ---------- logo 动画 ---------- */
  .logo { display: block; }
  .lg-bubble { animation: lg-bob 3.6s ease-in-out infinite; }
  .lg-steam { animation: lg-steam 2.8s ease-out infinite; }
  .lg-steam2 { animation-delay: 1.4s; }
  .lg-stickA, .lg-stickB { transform-box: view-box; transform-origin: 100px 115px; }
  .lg-stickA { animation: lg-pinchA 2.4s ease-in-out infinite; }
  .lg-stickB { animation: lg-pinchB 2.4s ease-in-out infinite; }
  .lg-dot1 { animation: lg-float 3s ease-in-out infinite; }
  .lg-dot2 { animation: lg-float 3s ease-in-out 1s infinite; }
  @keyframes lg-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes lg-steam { 0% { opacity: 0; transform: translateY(5px); } 25% { opacity: .95; } 70% { opacity: .5; } 100% { opacity: 0; transform: translateY(-8px); } }
  @keyframes lg-pinchA { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-4deg); } }
  @keyframes lg-pinchB { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(4.5deg); } }
  @keyframes lg-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

  /* ---------- 左：品牌区（宽度流式缩放） ---------- */
  .pitch { grid-column: 2; align-self: center; padding-bottom: 10px; }
  .brandrow { display: flex; align-items: center; gap: clamp(14px, 1.2vw, 22px); }
  .brandrow .logo { width: clamp(92px, 7.5vw, 140px); height: auto; flex: none; }
  .wordmark b { display: block; font-size: clamp(34px, 2.8vw, 54px); font-weight: 900; letter-spacing: .5px; }
  .wordmark b em { font-style: normal; color: var(--zhu); }
  .wordmark span { display: block; margin-top: 4px; font-size: clamp(12px, .95vw, 16px); letter-spacing: .42em; color: var(--ink-3); }
  h1.headline { margin-top: clamp(18px, 2.2vh, 30px); font-size: clamp(25px, 2.35vw, 42px); font-weight: 900; line-height: 1.5; }
  h1.headline em { font-style: normal; white-space: nowrap; box-shadow: inset 0 -.18em 0 rgba(178,58,47,.28); }
  .sub { margin-top: 12px; font-size: clamp(13px, 1vw, 17px); color: var(--ink-2); line-height: 1.9; font-family: "PingFang SC", sans-serif; }
  .points { margin-top: clamp(16px, 2vh, 26px); }
  .point { display: flex; align-items: baseline; padding: .6em 2px .55em; border-bottom: 1px solid rgba(38,32,25,.22); }
  .point:first-child { border-top: 2.5px solid var(--ink); }
  .point .cn { font-weight: 900; font-size: clamp(14px, 1.05vw, 19px); letter-spacing: .12em; flex: none; }
  .point .lead { flex: none; width: clamp(22px, 2vw, 38px); border-bottom: 2px dotted rgba(38,32,25,.4); margin: 0 10px 4px; }
  .point .en { font-size: clamp(12px, .92vw, 16px); color: var(--ink-3); font-family: "PingFang SC", sans-serif; }
  .tryline { margin-top: clamp(14px, 2vh, 24px); font-size: clamp(12px, .88vw, 15px); color: var(--ink-3); line-height: 1.9; font-family: "PingFang SC", sans-serif; }
  .tryline b { color: var(--zhu); font-weight: 700; }

  /* ---------- 中：手机（屏内恒为 393x852 调试尺寸，整体 scale 适配） ---------- */
  .phone-zone { grid-column: 3; display: grid; place-items: center; min-height: 0; margin-left: clamp(36px, 4.5vw, 100px); }
  .phone-fit { position: relative; }
  .phone-wrap { position: absolute; left: 0; top: 0; transform-origin: top left; width: 415px; }
  .phone-wrap::before {
    content: ""; position: absolute; left: 6%; right: 6%; bottom: -30px; height: 44px; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(38,32,25,.3), transparent 68%);
  }
  .iphone {
    position: relative; width: 415px; height: 874px; /* 屏内 = 393x852，和 app.html 调试视口一致 */
    border-radius: 58px; background: #0d0b09; padding: 11px;
    box-shadow: 0 0 0 4.5px #3d3833, 0 0 0 6px #6e675e, 0 0 0 7px #2b2723,
      0 30px 60px rgba(38,32,25,.35), inset 0 0 0 3px #000;
  }
  .iphone::before {
    content: ""; position: absolute; inset: -6px; border-radius: 62px; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,.5) 0%, transparent 12%, transparent 55%, rgba(255,255,255,.28) 68%, transparent 78%);
    -webkit-mask: linear-gradient(#fff, #fff) content-box, linear-gradient(#fff, #fff);
    -webkit-mask-composite: xor; mask-composite: exclude; padding: 6px; opacity: .5;
  }
  .btn-side { position: absolute; background: linear-gradient(90deg, #55504a, #23201c); border-radius: 3px; }
  .b-action { left: -8.5px; top: 16%; width: 4px; height: 30px; }
  .b-vol1 { left: -8.5px; top: 26%; width: 4px; height: 52px; }
  .b-vol2 { left: -8.5px; top: 34%; width: 4px; height: 52px; }
  .b-power { right: -8.5px; top: 28%; width: 4px; height: 78px; background: linear-gradient(270deg, #55504a, #23201c); }
  .screen-hole { position: relative; width: 100%; height: 100%; border-radius: 50px; overflow: hidden; background: #000; }
  .screen-hole iframe { position: relative; z-index: 2; width: 100%; height: 100%; border: none; display: block; background: #f7f2e6; }
  .island { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 108px; height: 30px; border-radius: 999px; background: #000; z-index: 5; box-shadow: inset 0 0 2px rgba(255,255,255,.06); }
  .island::after { content: ""; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 9px; height: 9px; border-radius: 99px; background: radial-gradient(circle at 35% 35%, #1c2733, #05070a 70%); }
  .glass { position: absolute; inset: 0; border-radius: 50px; pointer-events: none; z-index: 6;
    background: linear-gradient(118deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.03) 18%, transparent 32%); }
  .iframe-fallback { position: absolute; inset: 0; display: grid; place-items: center; color: #b9ad97; font-size: 13px; text-align: center; line-height: 2; z-index: 1; }

  /* ---------- 底：用户动线时间轴（手卷，宽度流式缩放） ---------- */
  .journey { grid-column: 1 / -1; border-top: 2.5px solid var(--ink); margin-top: 10px; padding: 10px 6px 1.6vh; position: relative; }
  .jcap { text-align: center; height: 2.2em; font-size: clamp(13px, .95vw, 17px); color: var(--ink-2); font-family: "PingFang SC", sans-serif; }
  .jcap b { font-family: "Songti SC", serif; font-size: 1.12em; color: var(--ink); margin-right: 10px; letter-spacing: .08em; }
  .jcap b i { font-style: normal; color: var(--zhu); font-family: ui-monospace, monospace; }
  .jtrack { position: relative; margin-top: 8px; }
  .jline { position: absolute; left: 3%; right: 3%; top: calc(var(--dot) / 2); border-top: 1px solid rgba(38,32,25,.3); }
  .jfill { position: absolute; left: 3%; top: calc(var(--dot) / 2 - 1px); height: 2px; background: var(--zhu); width: 0; transition: width .45s cubic-bezier(.25,1,.5,1); max-width: 94%; }
  .jnodes { position: relative; display: flex; justify-content: space-between; padding: 0 3%; }
  .jnode { background: none; border: none; cursor: pointer; font: inherit; text-align: center; width: clamp(96px, 10vw, 170px); }
  .jnode .dot {
    width: var(--dot); height: var(--dot); margin: 0 auto; border-radius: 50%;
    border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink);
    display: grid; place-items: center; font-size: clamp(13px, 1vw, 17px); font-weight: 900; font-family: ui-monospace, monospace;
    transition: background .2s, color .2s, border-color .2s, transform .2s; position: relative; z-index: 2;
  }
  .jnode .tt { margin-top: 7px; font-size: clamp(12.5px, 1vw, 18px); font-weight: 800; letter-spacing: .05em; }
  .jnode .zh { margin-top: 2px; font-size: clamp(10.5px, .82vw, 14px); color: var(--ink-3); font-family: "PingFang SC", sans-serif; }
  .jnode:hover .dot { background: var(--ink); color: var(--paper); }
  .jnode.on .dot { background: var(--zhu); border-color: var(--zhu-deep); color: #f6efdc; transform: scale(1.12) rotate(-3deg); }
  .jnode.on .tt { color: var(--zhu); }
  .jhint { position: absolute; right: 10px; bottom: 5px; font-size: 10px; color: var(--ink-4); letter-spacing: .15em; font-family: "PingFang SC", sans-serif; }

  .variant-tag { position: fixed; right: 8px; bottom: 3px; z-index: 70; font-size: 10px; color: var(--ink-4); letter-spacing: .1em; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media (max-width: 1080px) { .pitch .sub { display: none; } .jnode .zh { display: none; } }
</style>
</head>
<body>
<div class="grain"></div>
<div class="stage">

  <!-- 左：品牌区 -->
  <aside class="pitch">
    <div class="brandrow">
      <svg class="logo" viewBox="0 0 200 200" aria-label="Chopstory logo">
        <g class="lg-bubble">
          <g transform="translate(125,45) scale(1) translate(-125,-45)">
            <path class="lg-steam" d="M 100 110 Q 115 95, 105 85 T 120 70" fill="none" stroke="#DCA842" stroke-width="5" stroke-linecap="round"/>
            <path class="lg-steam lg-steam2" d="M 88 106 Q 97 96, 91 88" fill="none" stroke="#DCA842" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M 120 70 C 105 70, 100 55, 115 45 C 115 30, 135 25, 145 35 C 155 25, 175 35, 170 50 C 180 60, 165 75, 150 70 C 140 78, 125 75, 120 70 Z" fill="#D24B33" stroke="#1C1A17" stroke-width="4" stroke-linejoin="round"/>
            <circle cx="135" cy="50" r="4" fill="#FBF9F3"/>
            <circle cx="150" cy="50" r="4" fill="#FBF9F3"/>
            <path d="M 140 58 Q 142.5 61, 145 58" fill="none" stroke="#FBF9F3" stroke-width="2.5" stroke-linecap="round"/>
          </g>
        </g>
        <g transform="translate(100, 115) rotate(30) translate(-100, -115)">
          <g class="lg-stickA"><path d="M 60 50 L 142 132 C 145 135, 140 140, 137 137 L 55 55 C 52 52, 57 47, 60 50 Z" fill="#1C1A17"/></g>
          <g class="lg-stickB"><path d="M 72 42 L 154 124 C 157 127, 152 132, 149 129 L 67 47 C 64 44, 69 39, 72 42 Z" fill="#1C1A17"/></g>
        </g>
        <rect x="80" y="165" width="40" height="12" rx="6" fill="#1C1A17"/>
        <path d="M 45 115 C 45 115, 40 165, 100 165 C 160 165, 155 115, 155 115 C 155 115, 130 120, 100 120 C 70 120, 45 115, 45 115 Z" fill="#D24B33" stroke="#1C1A17" stroke-width="5" stroke-linejoin="round"/>
        <path d="M 55 115 C 55 102, 75 92, 100 92 C 125 92, 145 102, 145 115 Z" fill="#FBF9F3" stroke="#1C1A17" stroke-width="4"/>
        <circle class="lg-dot1" cx="80" cy="80" r="3" fill="#DCA842"/>
        <circle class="lg-dot2" cx="115" cy="78" r="4.5" fill="#DCA842"/>
      </svg>
      <div class="wordmark">
        <b>Chop<em>story</em></b>
        <span>筷子故事</span>
      </div>
    </div>
    <!-- slogan 大字（2026-07-12 Julia 定稿） -->
    <h1 class="headline" id="slogan">外国人的点餐伙伴<br>读得懂、点得对、<em>吃得明白</em></h1>
    <p class="sub" id="sloganSub">拍一张中文菜单，讲懂每道菜、标出过敏雷点、帮他和服务员沟通。</p>
    <div class="points">
      <div class="point"><span class="cn">看懂</span><span class="lead"></span><span class="en">每道菜是什么、招牌是哪道</span></div>
      <div class="point"><span class="cn">放心</span><span class="lead"></span><span class="en">辣度、过敏原自动标出来</span></div>
      <div class="point"><span class="cn">点单</span><span class="lead"></span><span class="en">点单卡翻面是中文，递给服务员就能下单</span></div>
    </div>
    <p class="tryline"><b>右边这台手机可以直接点着玩</b>，或点下方时间轴任意一站，直达对应界面。</p>
  </aside>

  <!-- 中：iPhone（内容恒为 392px 调试尺寸） -->
  <div class="phone-zone">
    <div class="phone-fit" id="phoneFit">
      <div class="phone-wrap" id="phoneWrap">
        <div class="iphone">
          <span class="btn-side b-action"></span>
          <span class="btn-side b-vol1"></span>
          <span class="btn-side b-vol2"></span>
          <span class="btn-side b-power"></span>
          <div class="screen-hole">
            <div class="iframe-fallback">运行 dev server 后<br>此处即真机交互 demo</div>
            <iframe id="appframe" src="app.html" title="Chopstory demo"></iframe>
            <span class="island"></span>
            <span class="glass"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 底：用户动线时间轴（一个外国游客的一顿饭，七站） -->
  <div class="journey">
    <div class="jcap" id="jcap"></div>
    <div class="jtrack">
      <div class="jline"></div>
      <div class="jfill" id="jfill"></div>
      <div class="jnodes" id="jnodes"></div>
    </div>
    <span class="jhint">键盘 ← → 切换</span>
  </div>
</div>
<span class="variant-tag">方案A · 迭代3</span>

<script>
/* ---- 手机适配：屏内恒为 393x852 调试尺寸，按可用高度整体缩放 ---- */
const PHONE_W = 415, PHONE_H = 874, PHONE_MARGIN = 26; /* 阴影/金属圈留白 */
function fitPhone() {
  const zone = document.querySelector(".phone-zone");
  const s = Math.min(
    1.1,
    (zone.clientHeight - PHONE_MARGIN) / PHONE_H,
    (window.innerWidth * 0.44) / PHONE_W
  );
  const fit = document.getElementById("phoneFit");
  fit.style.width = PHONE_W * s + "px";
  fit.style.height = PHONE_H * s + "px";
  document.getElementById("phoneWrap").style.transform = `scale(${s})`;
}
window.addEventListener("resize", fitPhone);

/* ---- user journey 七站 ---- */
const STAGES = [
  { k: "home",      n: 1, t: "到店",       zh: "看不懂中文菜单", note: "外国游客坐下，面对一整页看不懂的中文菜单", act: w => w.go("home") },
  { k: "camera",    n: 2, t: "拍菜单",     zh: "对着菜单拍一张", note: "对着纸质菜单拍一张照片，入口只有这一个动作", act: w => w.startScan("camera") },
  { k: "analyzing", n: 3, t: "AI 识别",    zh: "自动读懂菜名",   note: "AI 识别菜名，自动标出辣度和过敏原，约三秒出结果", act: w => w.startAnalyze() },
  { k: "list",      n: 4, t: "英文菜单",   zh: "每道菜都看得懂", note: "整份菜单变成英文：每道是什么、多少钱、招牌是哪道", act: w => ensureMenu(w) },
  { k: "detail",    n: 5, t: "菜品详情",   zh: "讲清这道菜",     note: "一道菜讲明白：是什么做的、怎么吃、含不含他的忌口", act: w => { ensureMenu(w); w.openDetail(8); } },
  { k: "order",     n: 6, t: "中文点单卡", zh: "翻面递给服务员", note: "选好的菜生成点单卡，翻面是中文，直接递给服务员照单", act: w => seedOrder(w) },
  { k: "map",       n: 7, t: "美食地图",   zh: "记录吃过的美食", note: "吃过的每道菜记在地图上，攒成他自己的中国美食地图", act: w => { w.go("history"); w.histView("map"); } },
];
let cur = 0;

function appWin() { const w = document.getElementById("appframe").contentWindow; return (w && w.go) ? w : null; }
function ensureMenu(w) {
  let ready = false;
  try { ready = w.eval('typeof streamed !== "undefined" && streamed.length > 0'); } catch (e) {}
  if (ready) w.go("list"); else w.beginStream();
}
function seedOrder(w) {
  ensureMenu(w);
  let empty = true;
  try { empty = w.eval("order.size === 0"); } catch (e) {}
  if (empty) { w.addToOrder(3, 1); w.addToOrder(8, 1); }
  w.openOrder();
}
function jumpTo(i) {
  cur = i; const s = STAGES[i];
  document.querySelectorAll(".jnode").forEach((n, j) => n.classList.toggle("on", j === i));
  document.getElementById("jfill").style.width = (3 + (94 * i / (STAGES.length - 1))) + "%";
  document.getElementById("jcap").innerHTML = `<b><i>${s.n}</i> · ${s.t}</b>${s.note}`;
  const w = appWin(); if (!w) return;
  try { w.closeDetail && w.closeDetail(); } catch (e) {}
  try { w.closeSheet && w.closeSheet(false); } catch (e) {}
  try { s.act(w); } catch (e) { console.warn("jump failed:", e); }
  /* app 首跑会在 600ms 后自动弹偏好底屉（app.html:265）；非首页站补一次关闭 */
  if (s.k !== "home") setTimeout(() => {
    const w2 = appWin();
    if (w2) try { w2.closeSheet && w2.closeSheet(false); } catch (e) {}
  }, 900);
}
document.getElementById("jnodes").innerHTML = STAGES.map((s, i) =>
  `<button class="jnode" onclick="jumpTo(${i})"><span class="dot">${s.n}</span><div class="tt">${s.t}</div><div class="zh">${s.zh}</div></button>`
).join("");
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") jumpTo(Math.min(cur + 1, STAGES.length - 1));
  if (e.key === "ArrowLeft") jumpTo(Math.max(cur - 1, 0));
});
jumpTo(0);
fitPhone();
</script>
</body>
</html>
