<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MenuLens - Scan Chinese menus with confidence</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #171717;
    --muted: #737373;
    --paper: #ffffff;
    --line: #e5e5e5;
    --danger: #b91c1c;
    --warn: #b45309;
  }
  body {
    min-height: 100dvh;
    background: #fafafa;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    width: min(100%, 520px);
    min-height: 100dvh;
    margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 19px; line-height: 1; letter-spacing: 0; }
  #langSelect {
    min-height: 36px;
    border: 1px solid #d4d4d4;
    border-radius: 999px;
    padding: 6px 12px;
    background: #fff;
    color: #262626;
    font-size: 14px;
  }
  #hero {
    flex: 1;
    min-height: 420px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 14px;
    text-align: center;
  }
  .mark {
    width: 68px;
    height: 68px;
    border-radius: 20px;
    display: grid;
    place-items: center;
    background: var(--ink);
    color: #fff;
    font-size: 31px;
    font-weight: 800;
  }
  .lead { max-width: 320px; color: var(--muted); font-size: 16px; line-height: 1.45; }
  .demo-picker {
    width: min(100%, 320px);
    display: grid;
    gap: 6px;
    text-align: left;
  }
  .demo-picker label {
    color: #8a8a8a;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  #demoRestaurant {
    width: 100%;
    min-height: 42px;
    border: 1px solid #d4d4d4;
    border-radius: 12px;
    padding: 8px 12px;
    background: #fff;
    color: #262626;
    font-size: 15px;
  }
  button, select { font: inherit; }
  .btn-primary, .btn-secondary, #retryBtn {
    min-height: 48px;
    border: none;
    border-radius: 999px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-primary {
    min-width: 210px;
    padding: 0 24px;
    background: var(--ink);
    color: #fff;
    font-size: 17px;
  }
  .btn-secondary {
    width: 100%;
    background: #fff;
    color: #262626;
    border: 1px solid #d4d4d4;
  }
  button:active { transform: scale(.98); }
  #preview {
    width: 100%;
    max-height: 136px;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid var(--line);
  }
  #results { display: flex; flex-direction: column; gap: 10px; }
  .section-title {
    margin: 6px 0 0;
    color: #8a8a8a;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .card {
    margin-top: 8px;
    padding: 15px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .name-cn { font-size: 16px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
  .pinyin { display: inline-block; margin-left: 7px; color: #8a8a8a; font-size: 13px; font-weight: 500; }
  .name { margin-top: 3px; color: #3f3f46; font-size: 14px; font-weight: 650; line-height: 1.25; }
  .price { white-space: nowrap; font-size: 14px; font-weight: 800; }
  .desc { margin-top: 9px; color: #525252; font-size: 14px; line-height: 1.4; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 700; }
  .tag-red { background: #fee2e2; color: var(--danger); }
  .tag-amber { background: #fef3c7; color: var(--warn); }
  .ingredients { margin-top: 9px; color: #8a8a8a; font-size: 12px; line-height: 1.35; }
  #skeleton .bar {
    height: 12px;
    border-radius: 999px;
    background: #e5e5e5;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  #errorBox {
    padding: 15px;
    border-radius: 12px;
    background: #fef2f2;
    color: var(--danger);
    font-size: 14px;
    line-height: 1.4;
  }
  #retryBtn {
    width: 100%;
    margin-top: 10px;
    background: var(--danger);
    color: #fff;
  }
  footer {
    margin-top: auto;
    padding-top: 8px;
    color: #8a8a8a;
    text-align: center;
    font-size: 11px;
    line-height: 1.45;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MenuLens</h1>
    <select id="langSelect" aria-label="Result language">
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
    </select>
  </header>

  <main id="hero">
    <div class="mark">ML</div>
    <p class="lead">Scan a Chinese menu and get dish cards you can actually order from.</p>
    <div class="demo-picker">
      <label for="demoRestaurant">Demo restaurant</label>
      <select id="demoRestaurant">
        <option value="mawangzi">马旺子 · Sichuan</option>
        <option value="lei-garden">利苑酒家 · Cantonese</option>
        <option value="beijing-cuisine">北京菜餐厅 · Beijing</option>
      </select>
    </div>
    <button class="btn-primary" type="button" onclick="startScan()">Scan Menu</button>
  </main>

  <img id="preview" class="hidden" alt="Uploaded menu preview">
  <div id="results">
    <div id="skeleton" class="card hidden" aria-live="polite">
      <div class="bar" style="width:42%"></div>
      <div class="bar" style="width:66%;margin-top:9px"></div>
      <div class="bar" style="width:100%;margin-top:14px"></div>
      <div class="bar" style="width:78%;margin-top:8px"></div>
    </div>
  </div>
  <div id="errorBox" class="hidden">
    <span id="errorMsg"></span>
    <button id="retryBtn" class="hidden" type="button">Retry</button>
  </div>
  <button id="scanAgainBtn" class="btn-secondary hidden" type="button" onclick="startScan()">Scan another menu</button>

  <input id="fileInput" type="file" accept="image/*" capture="environment" class="hidden">

  <footer>
    AI-estimated from typical recipes, not actual ingredients. Chinese kitchens commonly use peanut and sesame oil.
    If you have severe allergies, always confirm with staff.
  </footer>
</div>

let lastImage = null;
let groupEls = new Map();

const saved = localStorage.getItem(LANG_KEY);
if (saved && ["en", "ja", "ko", "es", "fr"].includes(saved)) $("langSelect").value = saved;
$("langSelect").addEventListener("change", (e) => localStorage.setItem(LANG_KEY, e.target.value));

function startScan() {
  if (FILE_DEMO_MODE) {
    analyze(null);
  } else {
    fileInput.click();
  }
}

fileInput.addEventListener("change", async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const image = await compressImage(file);
  lastImage = image;
  $("preview").src = image;
  $("preview").classList.remove("hidden");
  analyze(image);
});

async function compressImage(file) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 1568 / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL("image/jpeg", 0.8);
}

function resetResults() {
  groupEls = new Map();
  [...$("results").children].forEach((el) => {
    if (el.id !== "skeleton") el.remove();
  });
  $("errorBox").classList.add("hidden");
  $("scanAgainBtn").classList.add("hidden");
}

async function analyze(image) {
  $("hero").classList.add("hidden");
  resetResults();
  if (FILE_DEMO_MODE) $("preview").classList.add("hidden");
  $("skeleton").classList.remove("hidden");
  if (FILE_DEMO_MODE) {
    await runLocalDemo();
    return;
  }
  try {
    const res = await fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image, lang: $("langSelect").value, mockRestaurant: $("demoRestaurant").value }),
    });
    if (!res.ok || !res.body) return showError("upstream_error");
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop() || "";
      for (const line of lines) {
        if (!handleLine(line)) {
          reader.cancel();
          return;
        }
      }
    }
    if (buf.trim()) handleLine(buf);
  } catch {
    showError("upstream_error");
  }
}

async function runLocalDemo() {
  const dishes = MOCK_RESTAURANTS[$("demoRestaurant").value] || MOCK_RESTAURANTS.mawangzi;
  for (const dish of dishes) {
    await new Promise((resolve) => setTimeout(resolve, 35));
    appendDish(dish);
  }
  finish();
}

function handleLine(line) {
  if (!line.trim()) return true;
  let ev;
  try {
    ev = JSON.parse(line);
  } catch {
    return true;
  }
  if (ev.type === "dish" && ev.data) appendDish(ev.data);
  else if (ev.type === "error") {
    showError(ev.code);
    return false;
  } else if (ev.type === "done") {
    finish();
  }
  return true;
}

function appendDish(d) {
  const key = d.category == null ? "" : d.category;
  let group = groupEls.get(key);
  if (!group) {
    group = document.createElement("section");
    if (key) group.innerHTML = '<h2 class="section-title">' + esc(key) + "</h2>";
    groupEls.set(key, group);
    $("results").insertBefore(group, $("skeleton"));
  }
  group.insertAdjacentHTML("beforeend", dishCardHTML(d));
}

function dishCardHTML(d) {
  const tags = (d.allergens || []).map((a) =>
    '<span class="tag ' + (a.level === "contains" ? "tag-red" : "tag-amber") + '">' +
    (a.level === "contains" ? "Contains" : "May contain") + ": " + esc(ALLERGEN_LABELS[a.type] || a.type) + "</span>"
  ).join("");
  return '<article class="card">' +
    '<div class="card-top"><div>' +
      '<div class="name-cn">' + esc(d.nameCn) + (d.pinyin ? '<span class="pinyin">' + esc(d.pinyin) + "</span>" : "") + "</div>" +
      '<div class="name">' + esc(d.name) + (d.vegetarian ? " · Vegetarian" : "") + (d.spicy ? " · " + "Spicy ".repeat(d.spicy).trim() : "") + "</div>" +
    "</div>" +
    (d.price ? '<div class="price">' + esc(d.price) + "</div>" : "") +
    "</div>" +
    (d.description ? '<p class="desc">' + esc(d.description) + "</p>" : "") +
    (tags ? '<div class="tags">' + tags + "</div>" : "") +
    (d.ingredients && d.ingredients.length ? '<p class="ingredients">Main: ' + esc(d.ingredients.join(", ")) + "</p>" : "") +
  "</article>";
}

function finish() {
  $("skeleton").classList.add("hidden");
  $("scanAgainBtn").classList.remove("hidden");
}

function showError(code) {
  $("skeleton").classList.add("hidden");
  $("errorBox").classList.remove("hidden");
  $("errorMsg").textContent = ERROR_COPY[code] || ERROR_COPY.upstream_error;
  const retry = $("retryBtn");
  if (code === "upstream_error" && lastImage) {
    retry.classList.remove("hidden");
    retry.onclick = () => analyze(lastImage);
  } else {
    retry.classList.add("hidden");
  }
  $("scanAgainBtn").classList.remove("hidden");
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
